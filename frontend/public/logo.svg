<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cr-amethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cr-teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="cr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#11091f" stop-opacity="0" />
    </radialGradient>
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glow Base -->
  <circle cx="32" cy="32" r="30" fill="url(#cr-glow)" />

  <!-- Outer Dark Chamfered Shield -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#170c29" stroke="url(#cr-amethyst)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Geometric Cinema Projector Aperture -->
  <g filter="url(#cr-shadow)">
    <!-- Main Angular Cinema Lens Prism -->
    <path
      d="M32 14 L48 23.2 V40.8 L32 50 L16 40.8 V23.2 Z"
      fill="#1d1033"
      stroke="url(#cr-amethyst)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Overlapping Dynamic Electric Teal Beam Fold -->
    <path
      d="M32 14 L48 23.2 L32 32 L16 23.2 Z"
      fill="url(#cr-teal)"
      fill-opacity="0.85"
    />

    <!-- Diagonal Shutter Rays -->
    <path
      d="M32 32 L48 40.8 L32 50 Z"
      fill="url(#cr-amethyst)"
      fill-opacity="0.75"
    />

    <!-- Inner Ticket Notch / Projector Core -->
    <circle cx="32" cy="32" r="5" fill="#f8f4ff" />
    <circle cx="32" cy="32" r="8" stroke="url(#cr-teal)" stroke-width="2" stroke-dasharray="3 3" />
  </g>
</svg>
