<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a184a" />
      <stop offset="100%" stop-color="#11091f" />
    </linearGradient>
    <linearGradient id="cr-amethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cr-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with amethyst border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cr-bg)" stroke="#c084fc" stroke-width="3" />

  <!-- Bold Cinema Hexagonal Shutter -->
  <path
    d="M32 12 L50 22.4 V41.6 L32 52 L14 41.6 V22.4 Z"
    fill="#1d1033"
    stroke="#c084fc"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- High-Impact Electric Teal Projector Shutter Facet -->
  <path
    d="M32 12 L50 22.4 L32 32 L14 22.4 Z"
    fill="url(#cr-teal)"
  />

  <!-- Dynamic Amethyst Shutter Facet -->
  <path
    d="M32 32 L50 41.6 L32 52 Z"
    fill="url(#cr-amethyst)"
  />

  <!-- Bright Core Lens -->
  <circle cx="32" cy="32" r="6" fill="#ffffff" />
  <circle cx="32" cy="32" r="10" stroke="#06b6d4" stroke-width="2.5" />
</svg>